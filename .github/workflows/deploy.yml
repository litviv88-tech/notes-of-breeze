name: Деплой на GitHub Pages

on:
  push:
    branches: [main]

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Убрать локальный путь к JDK
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Проверить, что version.json совпадает с Gradle
        run: |
          CODE=$(sed -n 's/^appVersionCode = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          NAME=$(sed -n 's/^appVersionName = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          python3 - <<PY
          import json
          from pathlib import Path
          data = json.loads(Path("web/version.json").read_text(encoding="utf-8-sig"))
          code, name = "$CODE", "$NAME"
          assert str(data["versionCode"]) == code, f"versionCode {data['versionCode']} != {code}"
          assert data["versionName"] == name, f"versionName {data['versionName']} != {name}"
          print(f"APK {name} ({code}), webVersion {data['webVersion']}")
          PY

      - name: Собрать APK
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          for manager in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          do
            if [ -x "$manager" ]; then
              yes | "$manager" --licenses >/dev/null 2>&1 || true
              break
            fi
          done
          ./gradlew assembleDebug --no-daemon

      - name: Подготовить сайт
        run: |
          mkdir -p web/downloads
          APK="$(find . -name 'app-debug.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" web/downloads/BreezNotes.apk
          test -s web/downloads/BreezNotes.apk
          test -f web/version.json

      - name: Опубликовать GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          force_orphan: true
