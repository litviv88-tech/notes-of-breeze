name: Деплой на GitHub Pages

on:
  push:
    branches: [main]

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Убрать локальный путь к JDK
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Собрать APK
        continue-on-error: true
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          ./gradlew assembleDebug --no-daemon

      - name: Подготовить сайт
        run: |
          mkdir -p web/downloads
          APK="$(find . -name 'app-debug.apk' | head -n 1)"
          if [ -n "$APK" ]; then
            cp "$APK" web/downloads/BreezNotes.apk
          else
            curl -fsSL -o web/downloads/BreezNotes.apk \
              "https://litviv88-tech.github.io/notes-of-breeze/downloads/BreezNotes.apk"
          fi
          test -f web/downloads/BreezNotes.apk
          test -f web/version.json

      - name: Опубликовать GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          force_orphan: true
