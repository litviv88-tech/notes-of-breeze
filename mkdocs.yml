site_name: Breez Notes
site_description: Документация Android-приложения и веб-версии Breez Notes
site_url: https://litviv88-tech.github.io/notes-of-breeze/
repo_url: https://github.com/litviv88-tech/notes-of-breeze
repo_name: notes-of-breeze
docs_dir: docs
site_dir: site
theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - scheme: slate
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.tabs.link
    - toc.follow
nav:
  - Главная: index.md
  - Стек: stack.md
  - Архитектура: architecture.md
  - Схема данных: note-schema.md
  - Функции: features.md
  - Главный экран: home-screen.md
  - Веб-версия: web.md
  - Сборка и запуск: setup.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
copyright: Breez Notes 1.3.1
